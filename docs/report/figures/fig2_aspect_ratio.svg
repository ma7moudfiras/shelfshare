<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="430" fill="#ffffff"/>

  <text x="30" y="34" font-size="15" font-weight="bold" fill="#0b0b0b">Geometric discrimination of packaging format</text>
  <text x="30" y="54" font-size="11" fill="#52514e">Identical label design and equal volume; the visual embedding cannot separate them, the bounding-box ratio can.</text>

  <!-- ================= LEFT: two containers ================= -->

  <!-- standard 330 can -->
  <g>
    <!-- box -->
    <rect x="66" y="176" width="86" height="150" fill="none" stroke="#eda100" stroke-width="2.5" stroke-dasharray="6 3"/>
    <!-- can body -->
    <rect x="74" y="184" width="70" height="134" rx="7" fill="#f7f7f5" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="74" y="222" width="70" height="42" fill="#eda100" opacity="0.28"/>
    <ellipse cx="109" cy="186" rx="35" ry="6" fill="#e8e8e4" stroke="#9aa5b1" stroke-width="1.2"/>
    <text x="109" y="248" font-size="10" fill="#0b0b0b" text-anchor="middle" font-style="italic">same label</text>
    <!-- dims -->
    <path d="M56 176 L56 326" stroke="#52514e" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
    <text x="48" y="255" font-size="10" fill="#52514e" text-anchor="end">h</text>
    <path d="M66 340 L152 340" stroke="#52514e" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
    <text x="109" y="356" font-size="10" fill="#52514e" text-anchor="middle">w</text>

    <text x="109" y="384" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Standard 330 ml</text>
    <text x="109" y="401" font-size="10.5" fill="#52514e" text-anchor="middle">h/w ≈ 1.7</text>
    <text x="109" y="416" font-size="9.5" fill="#52514e" text-anchor="middle" font-family="monospace" stroke="#ffffff" stroke-width="3.2" paint-order="stroke">can-std-330</text>
  </g>

  <!-- slim can -->
  <g>
    <rect x="216" y="146" width="58" height="180" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-dasharray="6 3"/>
    <rect x="223" y="154" width="44" height="164" rx="6" fill="#f7f7f5" stroke="#9aa5b1" stroke-width="1.5"/>
    <rect x="223" y="212" width="44" height="46" fill="#eda100" opacity="0.28"/>
    <ellipse cx="245" cy="156" rx="22" ry="5" fill="#e8e8e4" stroke="#9aa5b1" stroke-width="1.2"/>
    <text x="245" y="240" font-size="9" fill="#0b0b0b" text-anchor="middle" font-style="italic">same label</text>

    <path d="M206 146 L206 326" stroke="#52514e" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
    <text x="198" y="240" font-size="10" fill="#52514e" text-anchor="end">h</text>
    <path d="M216 340 L274 340" stroke="#52514e" stroke-width="1" marker-start="url(#tk)" marker-end="url(#tk)"/>
    <text x="245" y="356" font-size="10" fill="#52514e" text-anchor="middle">w</text>

    <text x="245" y="384" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Slim</text>
    <text x="245" y="401" font-size="10.5" fill="#52514e" text-anchor="middle">h/w ≈ 2.6</text>
    <text x="245" y="416" font-size="9.5" fill="#52514e" text-anchor="middle" font-family="monospace" stroke="#ffffff" stroke-width="3.2" paint-order="stroke">can-slim</text>
  </g>

  <!-- divider -->
  <line x1="330" y1="100" x2="330" y2="400" stroke="#d8e1ec" stroke-width="1"/>

  <!-- ================= RIGHT: ratio bands ================= -->
  <text x="368" y="106" font-size="12" font-weight="bold" fill="#0b0b0b">Ratio bands used to assign format (n = 4,641 boxes)</text>
  <text x="368" y="124" font-size="10" fill="#52514e">Bands are definitional — the thresholds assign the class, so the separation is by construction.</text>

  <!-- axis -->
  <line x1="380" y1="330" x2="856" y2="330" stroke="#52514e" stroke-width="1.2"/>
  <g font-size="9.5" fill="#52514e" text-anchor="middle">
    <line x1="380" y1="330" x2="380" y2="336" stroke="#52514e"/><text x="380" y="350">0</text>
    <line x1="459" y1="330" x2="459" y2="336" stroke="#52514e"/><text x="459" y="350">1.0</text>
    <line x1="539" y1="330" x2="539" y2="336" stroke="#52514e"/><text x="539" y="350">2.0</text>
    <line x1="618" y1="330" x2="618" y2="336" stroke="#52514e"/><text x="618" y="350">3.0</text>
    <line x1="697" y1="330" x2="697" y2="336" stroke="#52514e"/><text x="697" y="350">4.0</text>
    <line x1="777" y1="330" x2="777" y2="336" stroke="#52514e"/><text x="777" y="350">5.0</text>
  </g>
  <text x="618" y="370" font-size="10.5" fill="#0b0b0b" text-anchor="middle">bounding-box aspect ratio (height / width)</text>

  <!-- threshold lines: 1.0 -> x=459 ; 2.1 -> x=546 ; 2.9 -> x=610 -->
  <line x1="459" y1="146" x2="459" y2="330" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="546" y1="146" x2="546" y2="330" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="610" y1="146" x2="610" y2="330" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="3 3"/>
  <g font-size="9" fill="#52514e" text-anchor="middle">
    <text x="459" y="142">1.0</text><text x="546" y="142">2.1</text><text x="610" y="142">2.9</text>
  </g>

  <!-- unknown-package : 0.25-0.98, median 0.54 ; x = 380 + r*79.4 -->
  <rect x="415" y="160" width="43" height="22" rx="3" fill="#e87ba4" opacity="0.35" stroke="#e87ba4" stroke-width="1.5"/>
  <line x1="423" y1="160" x2="423" y2="182" stroke="#0b0b0b" stroke-width="2"/>
  <text x="466" y="176" font-size="10" fill="#0b0b0b" font-family="monospace" stroke="#ffffff" stroke-width="3.2" paint-order="stroke">unknown-package</text>
  <text x="466" y="188" font-size="9" fill="#52514e" stroke="#ffffff" stroke-width="3.2" paint-order="stroke">n = 161 · median 0.54</text>

  <!-- can-std-330 : IQR 1.51-1.90, median 1.73 -->
  <rect x="500" y="200" width="31" height="22" rx="3" fill="#eda100" opacity="0.40" stroke="#eda100" stroke-width="1.5"/>
  <line x1="517" y1="200" x2="517" y2="222" stroke="#0b0b0b" stroke-width="2"/>
  <text x="540" y="216" font-size="10" fill="#0b0b0b" font-family="monospace" stroke="#ffffff" stroke-width="3.2" paint-order="stroke">can-std-330</text>
  <text x="540" y="228" font-size="9" fill="#52514e" stroke="#ffffff" stroke-width="3.2" paint-order="stroke">n = 947 · median 1.73</text>

  <!-- can-slim : IQR 2.39-2.73, median 2.57 -->
  <rect x="570" y="240" width="27" height="22" rx="3" fill="#1baf7a" opacity="0.40" stroke="#1baf7a" stroke-width="1.5"/>
  <line x1="584" y1="240" x2="584" y2="262" stroke="#0b0b0b" stroke-width="2"/>
  <text x="606" y="256" font-size="10" fill="#0b0b0b" font-family="monospace" stroke="#ffffff" stroke-width="3.2" paint-order="stroke">can-slim</text>
  <text x="606" y="268" font-size="9" fill="#52514e" stroke="#ffffff" stroke-width="3.2" paint-order="stroke">n = 1,666 · median 2.57</text>

  <!-- bottle-pet : IQR 3.08-3.57, median 3.26 -->
  <rect x="625" y="280" width="39" height="22" rx="3" fill="#2a78d6" opacity="0.40" stroke="#2a78d6" stroke-width="1.5"/>
  <line x1="639" y1="280" x2="639" y2="302" stroke="#0b0b0b" stroke-width="2"/>
  <text x="673" y="296" font-size="10" fill="#0b0b0b" font-family="monospace" stroke="#ffffff" stroke-width="3.2" paint-order="stroke">bottle-pet</text>
  <text x="673" y="308" font-size="9" fill="#52514e" stroke="#ffffff" stroke-width="3.2" paint-order="stroke">n = 1,867 · median 3.26</text>

  <defs>
    <marker id="tk" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <line x1="3" y1="0" x2="3" y2="6" stroke="#52514e" stroke-width="1.2"/>
    </marker>
  </defs>
</svg>
