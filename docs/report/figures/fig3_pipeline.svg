<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- ============ STAGE BANDS ============ -->
  <rect x="24" y="64" width="852" height="118" rx="6" fill="#f4f7fb" stroke="#d8e1ec" stroke-width="1"/>
  <rect x="24" y="196" width="852" height="104" rx="6" fill="#f4f7fb" stroke="#d8e1ec" stroke-width="1"/>
  <rect x="24" y="314" width="852" height="132" rx="6" fill="#f4f7fb" stroke="#d8e1ec" stroke-width="1"/>

  <text x="36" y="52" font-size="15" font-weight="bold" fill="#0b0b0b">Three-stage recognition pipeline</text>

  <!-- stage labels -->
  <text x="38" y="84" font-size="11" font-weight="bold" fill="#2a78d6" letter-spacing="0.6">STAGE 1 · LOCALIZATION</text>
  <text x="38" y="216" font-size="11" font-weight="bold" fill="#eb6834" letter-spacing="0.6">STAGE 2 · MANUFACTURER</text>
  <text x="38" y="334" font-size="11" font-weight="bold" fill="#1baf7a" letter-spacing="0.6">STAGE 3 · PRODUCT &amp; FORMAT</text>

  <text x="800" y="84" font-size="10" fill="#52514e" text-anchor="end">trained · stable</text>
  <text x="800" y="216" font-size="10" fill="#52514e" text-anchor="end">zero-shot · no training</text>
  <text x="800" y="334" font-size="10" fill="#52514e" text-anchor="end">trained + rule-based</text>

  <!-- ============ STAGE 1 ============ -->
  <!-- input -->
  <rect x="44" y="96" width="112" height="66" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="100" y="122" font-size="11" fill="#0b0b0b" text-anchor="middle">Shelf image</text>
  <text x="100" y="140" font-size="10" fill="#52514e" text-anchor="middle">(field capture)</text>

  <path d="M162 129 L198 129" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="204" y="96" width="152" height="66" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="280" y="120" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Class-agnostic</text>
  <text x="280" y="136" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">detection</text>
  <text x="280" y="152" font-size="9.5" fill="#52514e" text-anchor="middle">single class: `product`</text>

  <path d="M362 129 L398 129" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="404" y="90" width="150" height="78" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="479" y="112" font-size="10.5" fill="#0b0b0b" text-anchor="middle">Bounding boxes</text>
  <text x="479" y="129" font-size="10.5" fill="#0b0b0b" text-anchor="middle">Unit counts</text>
  <text x="479" y="146" font-size="10.5" fill="#0b0b0b" text-anchor="middle">Shelf positions</text>
  <text x="479" y="161" font-size="9.5" fill="#52514e" text-anchor="middle">reused, not recomputed</text>

  <path d="M560 129 L596 129" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="602" y="96" width="120" height="66" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="662" y="122" font-size="11" fill="#0b0b0b" text-anchor="middle">Region crops</text>
  <text x="662" y="140" font-size="10" fill="#52514e" text-anchor="middle">one per detection</text>

  <!-- crop feeds stage 2 -->
  <path d="M662 168 L662 228" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="652" y="202" font-size="9.5" fill="#52514e" text-anchor="end">crop</text>

  <!-- geometry branch down the left -->
  <path d="M479 174 L479 190 L200 190 L200 360 L246 360" stroke="#1baf7a" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="212" y="184" font-size="9.5" fill="#1baf7a" font-style="italic">box geometry (w, h)</text>

  <!-- ============ STAGE 2 ============ -->
  <rect x="404" y="234" width="180" height="52" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="494" y="256" font-size="11.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Embedding similarity</text>
  <text x="494" y="273" font-size="9.5" fill="#52514e" text-anchor="middle">CLIP · nearest neighbour</text>

  <rect x="640" y="234" width="150" height="52" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="715" y="256" font-size="11" fill="#0b0b0b" text-anchor="middle">Manufacturer</text>
  <text x="715" y="273" font-size="9.5" fill="#52514e" text-anchor="middle">e.g. coca-cola</text>
  <path d="M590 260 L634 260" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- reference gallery -->
  <rect x="186" y="234" width="150" height="52" rx="4" fill="#fdf6ef" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="261" y="253" font-size="10.5" fill="#0b0b0b" text-anchor="middle">Reference gallery</text>
  <text x="261" y="270" font-size="9.5" fill="#52514e" text-anchor="middle">new SKU = add image</text>
  <path d="M342 260 L398 260" stroke="#eb6834" stroke-width="1.5" marker-end="url(#ao)"/>

  <!-- stage2 -> stage3 -->
  <path d="M715 292 L715 352" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="705" y="326" font-size="9.5" fill="#52514e" text-anchor="end">narrows candidates</text>

  <!-- ============ STAGE 3 ============ -->
  <rect x="246" y="336" width="176" height="50" rx="4" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
  <text x="334" y="356" font-size="11" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Geometric rule</text>
  <text x="334" y="373" font-size="9.5" fill="#52514e" text-anchor="middle">aspect ratio → format</text>

  <rect x="246" y="396" width="176" height="38" rx="4" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
  <text x="334" y="414" font-size="11" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Visual classifier</text>
  <text x="334" y="428" font-size="9.5" fill="#52514e" text-anchor="middle">brand variant</text>

  <!-- fusion -->
  <path d="M428 361 L470 361 L470 400" stroke="#52514e" stroke-width="1.5" fill="none"/>
  <path d="M428 415 L470 415" stroke="#52514e" stroke-width="1.5" fill="none"/>
  <circle cx="470" cy="408" r="13" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
  <text x="470" y="413" font-size="13" fill="#0b0b0b" text-anchor="middle">+</text>
  <text x="470" y="440" font-size="9.5" fill="#52514e" text-anchor="middle">fusion</text>
  <path d="M484 408 L534 408" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="540" y="378" width="250" height="58" rx="4" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
  <text x="665" y="399" font-size="11" font-weight="bold" fill="#0b0b0b" text-anchor="middle">SKU-level classification</text>
  <text x="665" y="418" font-size="10" fill="#52514e" text-anchor="middle" font-family="monospace">coca-cola-classic-can-slim-250ml</text>
  <text x="665" y="431" font-size="9" fill="#52514e" text-anchor="middle">or `unknown` when evidence is compromised</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1baf7a"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/>
    </marker>
  </defs>
</svg>
